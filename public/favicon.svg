<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon (brief W-8): "el nodo central con el pulso" (spec §1.1) -- the single center node of
       Logo.astro's three-node pulse symbol (●───●───●), on its own, glowing. Static (no animation:
       a favicon renders as one frame in a browser tab). Signal green stays the same on light/dark
       tabs -- it is the brand's own accent color, not a foreground/background swap. -->
  <defs>
    <filter id="pulse-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="16" cy="16" r="6.5" fill="#4AF2A1" filter="url(#pulse-glow)" />
</svg>
